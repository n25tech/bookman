name: CI

# GitHub-hosted runners (free for public repos) and GitHub Container Registry
# (free for public images). Nothing here can reach the home cluster: the cluster
# pulls ghcr.io/n25tech/bookman itself (deploy/k8s, README "Kubernetes").
on:
  push:
  # Pull requests from forks; branches of this repo are already tested by their push run.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # a newer push replaces an older run on branches; on the default branch every merge
  # finishes building
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bookman
          POSTGRES_PASSWORD: bookman
          POSTGRES_DB: bookman_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bookman" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CGO_ENABLED: "0"
      BOOKMAN_TEST_DATABASE_URL: postgres://bookman:bookman@localhost:5432/bookman_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make build
      - run: make test

      # Browser tests: a fresh server on the test fixture, first-run admin, Playwright.
      - name: End-to-end tests
        env:
          BOOKMAN_E2E_URL: http://127.0.0.1:18080
          BOOKMAN_E2E_USER: admin
          BOOKMAN_E2E_PASSWORD: e2e-password
        run: |
          psql "$BOOKMAN_TEST_DATABASE_URL" -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          mkdir -p "$RUNNER_TEMP/library/Books"
          cp web/e2e/fixtures/test-book.pdf "$RUNNER_TEMP/library/Books/"
          BOOKMAN_LISTEN=127.0.0.1:18080 BOOKMAN_DATABASE_URL="$BOOKMAN_TEST_DATABASE_URL" \
            BOOKMAN_LIBRARIES="Books=$RUNNER_TEMP/library/Books" ./bin/bookman > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 60); do curl -sf "$BOOKMAN_E2E_URL/api/healthz" >/dev/null && break; sleep 1; done
          curl -sf -X POST -H 'Content-Type: application/json' -H "Origin: $BOOKMAN_E2E_URL" \
            -d "{\"username\":\"$BOOKMAN_E2E_USER\",\"password\":\"$BOOKMAN_E2E_PASSWORD\"}" "$BOOKMAN_E2E_URL/api/auth/setup" >/dev/null
          for i in $(seq 30); do grep -q 'scan finished' "$RUNNER_TEMP/server.log" && break; sleep 1; done
          cd web && npx playwright install --with-deps chromium && npx playwright test
      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log" || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/test-results/
          retention-days: 7

  image:
    # Images for the default branch only (merges); branches only run the tests.
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          # :<commit> never changes; :prod is the newest merge, which the cluster pulls when
          # the pod restarts (README "Deploying a new build")
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags=$image:${GITHUB_SHA::12},$image:prod" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
