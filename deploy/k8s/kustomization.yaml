# bookman at https://bookman.home: `kubectl apply -k deploy/k8s` (see README "Kubernetes").
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bookman
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
configMapGenerator:
  # The config file; editing it and re-applying rolls the pod (the name gets a hash).
  - name: bookman-config
    files:
      - bookman.toml
# CI (.github/workflows/ci.yml) pushes :<12-char sha> and :prod on every merge to main;
# restart the Deployment to roll out. Pin a build by setting newTag to a sha.
images:
  - name: ghcr.io/n25tech/bookman
    newTag: prod
